# Development only: email goes to Mailpit (web UI http://localhost:8025). These override the
# empty SMTP_* values of .env; production keeps email off until SMTP is set in the server .env.
x-dev-smtp: &dev-smtp
  SMTP_HOST: ${DEV_SMTP_HOST:-mailpit}
  SMTP_PORT: ${DEV_SMTP_PORT:-1025}
  SMTP_STARTTLS: "false"
  SMTP_FROM: ${DEV_SMTP_FROM:-notifications@trading.local}

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .  # repo root, so the image can install libs/indicators
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # uvicorn honours X-Forwarded-For only from Nginx (fixed address below), so the rate
      # limiter sees real client IPs and nobody can spoof one by talking to :8000 directly
      FORWARDED_ALLOW_IPS: ${NGINX_IP:-172.30.57.10}
      # the .env value, unless the shell overrides it: the e2e suite switches chart analysis
      # off with `CHART_ANALYSIS_ENABLED=false docker compose up -d --no-deps backend`
      CHART_ANALYSIS_ENABLED: ${CHART_ANALYSIS_ENABLED:-true}
      <<: *dev-smtp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # healthy once migrations ran and the API answers: `docker compose up --wait` (CI e2e)
    # and the workers below wait for it (python is in the image; no extra package)
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, sys, urllib.request;
          r = urllib.request.urlopen("http://localhost:8000/api/v1/health/ready", timeout=4);
          sys.exit(0 if json.load(r).get("status") == "ok" else 1)
      start_period: 60s  # alembic upgrade head runs first
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .  # repo root, so the image can install libs/indicators
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *dev-smtp
    # the default queue (signal engine) and notifications (Telegram / email / push sends)
    command: celery -A app.tasks worker -Q celery,notifications --loglevel=info
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
      backend:  # never query the database before the backend has migrated it
        condition: service_healthy

  worker-backtest:  # backtests on their own queue, so they never delay the live signal engine
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *dev-smtp
    command: >-
      celery -A app.tasks worker -Q backtests,maintenance --concurrency 2 --hostname backtests@%h
      --loglevel=info
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
      backend:  # never query the database before the backend has migrated it
        condition: service_healthy

  # Telegram long polling for /start (linking), /stop and /status; idles without a token
  telegram-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: python -m app.notifications.telegram_bot
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - redis
      - db

  # B1: the cTrader live feed (docs/ctrader-feed.md); idles while CTRADER_ENABLED=false
  feed-ctrader:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: python -m app.feeds.ctrader
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      backend:
        condition: service_healthy

  # B1: a mock cTrader Open API (tools/fake_ctrader) for development and CI, never in
  # production. Only with its profile: docker compose --profile fake-ctrader up -d fake-ctrader,
  # then CTRADER_WS_URL=ws://fake-ctrader:5036
  fake-ctrader:
    profiles: ["fake-ctrader"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python /fake/fake_ctrader.py --port 5036 --tick-rate 2
    volumes:
      - ./tools/fake_ctrader:/fake:ro

  # development SMTP server: every email ends up in http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  beat:  # Celery beat: schedules signals.tick every minute (live signal engine)
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *dev-smtp
    command: celery -A app.tasks beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_started
      backend:  # tasks start after the database is migrated
        condition: service_healthy

  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"

  # B9: a fake ai-service for development and CI (tools/fake_ai_service, docs/ai-contract.md
  # section 10). Never in production (not in infra/deploy). Only with its profile:
  #   docker compose --profile fake-ai up -d fake-ai   then AI_SERVICE_URL=http://fake-ai:8001
  fake-ai:
    profiles: ["fake-ai"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn fake_ai_service:app --app-dir /fake --host 0.0.0.0 --port 8001
    environment:
      FAKE_AI_EXAMPLES: /examples
    volumes:
      - ./tools/fake_ai_service:/fake:ro
      - ./docs/api/ai-service-examples:/examples:ro

  # Y14/Y20: a fake Gemini generateContent endpoint for development and CI (tools/fake_gemini,
  # docs/chart-analysis.md). Never in production (not in infra/deploy), never a published port.
  # Only with its profile: docker compose --profile fake-gemini up -d fake-gemini, then
  # CHART_VISION_BASE_URL=http://fake-gemini:8002 and any non-empty GEMINI_API_KEY in .env
  fake-gemini:
    profiles: ["fake-gemini"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn fake_gemini:app --app-dir /fake --host 0.0.0.0 --port 8002
    volumes:
      - ./tools/fake_gemini:/fake:ro

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d:ro  # default.conf + trading-site.inc
    ports:
      - "${NGINX_PORT:-80}:80"
      # what the host's HTTPS proxy reaches in production (docs/https.md); loopback only
      - "127.0.0.1:${NGINX_PROXY_PORT:-8090}:8090"
    networks:
      default:
        ipv4_address: ${NGINX_IP:-172.30.57.10}
    depends_on:
      - backend

# dynamic addresses only from DOCKER_IP_RANGE, so no container can take NGINX_IP (outside it)
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.57.0/24}
          ip_range: ${DOCKER_IP_RANGE:-172.30.57.128/25}

volumes:
  db_data:
