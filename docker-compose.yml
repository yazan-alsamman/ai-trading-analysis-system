services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .  # repo root, so the image can install libs/indicators
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .  # repo root, so the image can install libs/indicators
      dockerfile: backend/Dockerfile
    env_file: .env
    command: celery -A app.tasks worker --loglevel=info
    depends_on:
      - redis
      - db

  beat:  # Celery beat: schedules signals.tick every minute (live signal engine)
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: celery -A app.tasks beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      - redis

  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
