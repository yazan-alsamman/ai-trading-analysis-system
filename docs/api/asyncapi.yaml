asyncapi: 3.0.0
info:
  title: AI Trading Platform WebSocket
  version: 1.0.0
  description: 'Generated by backend/scripts/asyncapi.py; human guide: docs/websocket.md and docs/chat.md.
    Every server message carries type, and topic messages also topic and sent_at.'
servers:
  production:
    host: 187.127.76.76:8080
    protocol: ws
    description: The VPS (HTTP only until a domain exists)
  local:
    host: localhost
    protocol: ws
    description: docker compose
defaultContentType: application/json
channels:
  socket:
    address: /ws/market
    title: The WebSocket connection
    description: One connection carries every topic. Authenticate with ?token=<access JWT> or ?api_key=<key
      with the stream scope>; refused connections are closed with 4401 (4429 over the connection limits).
      At most 50 topic subscriptions per connection, 4 KB per client frame; idle 75 s closes with 1001;
      a client that falls 256 messages behind is closed with 1013. The user and API key are re-checked
      on every heartbeat and at once when a key is revoked or the user deactivated (error auth_revoked,
      then 4401).
    messages:
      Subscribe:
        $ref: '#/components/messages/Subscribe'
      Unsubscribe:
        $ref: '#/components/messages/Unsubscribe'
      Ping:
        $ref: '#/components/messages/Ping'
      Typing:
        $ref: '#/components/messages/Typing'
      Subscribed:
        $ref: '#/components/messages/Subscribed'
      Unsubscribed:
        $ref: '#/components/messages/Unsubscribed'
      Snapshot:
        $ref: '#/components/messages/Snapshot'
      Pong:
        $ref: '#/components/messages/Pong'
      Heartbeat:
        $ref: '#/components/messages/Heartbeat'
      Error:
        $ref: '#/components/messages/Error'
    bindings:
      ws:
        query:
          type: object
          properties:
            token:
              type: string
              description: access JWT
            api_key:
              type: string
              description: tk_... (stream)
        bindingVersion: 0.1.0
  candles:
    address: candles:{instrument_id}:{timeframe}
    title: candles topic
    parameters:
      instrument_id:
        description: instrument id
      timeframe:
        enum:
        - 1m
        - 5m
        - 15m
        - 1h
        - 4h
        - 1d
    messages:
      Candle:
        $ref: '#/components/messages/Candle'
  signals:
    address: signals:{instrument_id}
    title: signals topic
    parameters:
      instrument_id:
        description: instrument id
    messages:
      Signal:
        $ref: '#/components/messages/Signal'
  user:
    address: user:{user_id}
    title: user topic (automatic, own user only)
    parameters:
      user_id:
        description: your user id
    messages:
      UserSignal:
        $ref: '#/components/messages/UserSignal'
      Notification:
        $ref: '#/components/messages/Notification'
      BacktestProgress:
        $ref: '#/components/messages/BacktestProgress'
      BacktestCompleted:
        $ref: '#/components/messages/BacktestCompleted'
      BacktestFailed:
        $ref: '#/components/messages/BacktestFailed'
      WorkspaceUpdated:
        $ref: '#/components/messages/WorkspaceUpdated'
      PriceAlert:
        $ref: '#/components/messages/PriceAlert'
  news:
    address: news
    title: news topic (all articles; API keys need news:read)
    messages:
      News:
        $ref: '#/components/messages/News'
  newsInstrument:
    address: news:{instrument_id}
    title: news topic of one instrument
    parameters:
      instrument_id:
        description: instrument id
    messages:
      News:
        $ref: '#/components/messages/News'
  chat:
    address: chat:{conversation_id}
    title: chat topic (participants and admins)
    parameters:
      conversation_id:
        description: conversation id
    messages:
      ChatMessage:
        $ref: '#/components/messages/ChatMessage'
      ChatMessageUpdated:
        $ref: '#/components/messages/ChatMessageUpdated'
      ChatRead:
        $ref: '#/components/messages/ChatRead'
      ChatTyping:
        $ref: '#/components/messages/ChatTyping'
operations:
  subscribe:
    action: send
    channel:
      $ref: '#/channels/socket'
    summary: Subscribe to a topic
    messages:
    - $ref: '#/channels/socket/messages/Subscribe'
  unsubscribe:
    action: send
    channel:
      $ref: '#/channels/socket'
    summary: Unsubscribe from a topic
    messages:
    - $ref: '#/channels/socket/messages/Unsubscribe'
  ping:
    action: send
    channel:
      $ref: '#/channels/socket'
    summary: Keep-alive
    messages:
    - $ref: '#/channels/socket/messages/Ping'
  typing:
    action: send
    channel:
      $ref: '#/channels/socket'
    summary: Typing indicator in a chat
    messages:
    - $ref: '#/channels/socket/messages/Typing'
  receiveControl:
    action: receive
    channel:
      $ref: '#/channels/socket'
    summary: Answers and connection messages
    messages:
    - $ref: '#/channels/socket/messages/Subscribed'
    - $ref: '#/channels/socket/messages/Unsubscribed'
    - $ref: '#/channels/socket/messages/Snapshot'
    - $ref: '#/channels/socket/messages/Pong'
    - $ref: '#/channels/socket/messages/Heartbeat'
    - $ref: '#/channels/socket/messages/Error'
  receiveCandles:
    action: receive
    channel:
      $ref: '#/channels/candles'
    summary: Live candles
    messages:
    - $ref: '#/channels/candles/messages/Candle'
  receiveSignals:
    action: receive
    channel:
      $ref: '#/channels/signals'
    summary: Live signals of an instrument
    messages:
    - $ref: '#/channels/signals/messages/Signal'
  receiveUser:
    action: receive
    channel:
      $ref: '#/channels/user'
    summary: Your own events
    messages:
    - $ref: '#/channels/user/messages/UserSignal'
    - $ref: '#/channels/user/messages/Notification'
    - $ref: '#/channels/user/messages/BacktestProgress'
    - $ref: '#/channels/user/messages/BacktestCompleted'
    - $ref: '#/channels/user/messages/BacktestFailed'
    - $ref: '#/channels/user/messages/WorkspaceUpdated'
    - $ref: '#/channels/user/messages/PriceAlert'
  receiveNews:
    action: receive
    channel:
      $ref: '#/channels/news'
    summary: New articles
    messages:
    - $ref: '#/channels/news/messages/News'
  receiveNewsInstrument:
    action: receive
    channel:
      $ref: '#/channels/newsInstrument'
    summary: New articles of one instrument
    messages:
    - $ref: '#/channels/newsInstrument/messages/News'
  receiveChat:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: A conversation
    messages:
    - $ref: '#/channels/chat/messages/ChatMessage'
    - $ref: '#/channels/chat/messages/ChatMessageUpdated'
    - $ref: '#/channels/chat/messages/ChatRead'
    - $ref: '#/channels/chat/messages/ChatTyping'
components:
  messages:
    Subscribe:
      name: Subscribe
      title: Subscribe
      summary: 'Subscribe to a topic. candles: instrument_id + timeframe; signals: instrument_id; user:
        user_id (your own; automatic anyway); news: optional instrument_id; chat: conversation_id (participants
        and admins only). Answer: subscribed (+ snapshot for candles) or error.'
      contentType: application/json
      payload:
        additionalProperties: false
        properties:
          topic:
            enum:
            - candles
            - signals
            - user
            - news
            - chat
            title: Topic
            type: string
          instrument_id:
            anyOf:
            - format: uuid
              type: string
            - type: 'null'
            default: null
            title: Instrument Id
          timeframe:
            anyOf:
            - $ref: '#/components/schemas/Timeframe'
            - type: 'null'
            default: null
          user_id:
            anyOf:
            - format: uuid
              type: string
            - type: 'null'
            default: null
            title: User Id
          conversation_id:
            anyOf:
            - format: uuid
              type: string
            - type: 'null'
            default: null
            title: Conversation Id
          op:
            const: subscribe
            title: Op
            type: string
        required:
        - topic
        - op
        title: SubscribeMessage
        type: object
    Unsubscribe:
      name: Unsubscribe
      title: Unsubscribe
      summary: Same fields as subscribe.
      contentType: application/json
      payload:
        additionalProperties: false
        properties:
          topic:
            enum:
            - candles
            - signals
            - user
            - news
            - chat
            title: Topic
            type: string
          instrument_id:
            anyOf:
            - format: uuid
              type: string
            - type: 'null'
            default: null
            title: Instrument Id
          timeframe:
            anyOf:
            - $ref: '#/components/schemas/Timeframe'
            - type: 'null'
            default: null
          user_id:
            anyOf:
            - format: uuid
              type: string
            - type: 'null'
            default: null
            title: User Id
          conversation_id:
            anyOf:
            - format: uuid
              type: string
            - type: 'null'
            default: null
            title: Conversation Id
          op:
            const: unsubscribe
            title: Op
            type: string
        required:
        - topic
        - op
        title: UnsubscribeMessage
        type: object
    Ping:
      name: Ping
      title: Ping
      summary: Keep-alive; answered with pong.
      contentType: application/json
      payload:
        additionalProperties: false
        properties:
          op:
            const: ping
            title: Op
            type: string
        required:
        - op
        title: PingMessage
        type: object
    Typing:
      name: Typing
      title: Typing
      summary: Ephemeral typing indicator in a chat you are subscribed to (forwarded as chat_typing, at
        most once per 3 s per user).
      contentType: application/json
      payload:
        additionalProperties: false
        description: Ephemeral "is typing" in a chat the client is subscribed to (not stored).
        properties:
          op:
            const: typing
            title: Op
            type: string
          conversation_id:
            format: uuid
            title: Conversation Id
            type: string
        required:
        - op
        - conversation_id
        title: TypingMessage
        type: object
    Subscribed:
      name: Subscribed
      title: Subscribed
      summary: A subscribe was accepted.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - topic
        properties:
          type:
            const: subscribed
          topic:
            type: string
          sent_at: &id001
            type: integer
            description: server publish time, unix milliseconds
    Unsubscribed:
      name: Unsubscribed
      title: Unsubscribed
      summary: An unsubscribe was done (by the client, or by the server with a reason).
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - topic
        properties:
          type:
            const: unsubscribed
          topic:
            type: string
          sent_at: *id001
          reason:
            type: string
            enum:
            - forbidden
            description: 'set when the server dropped the topic itself: the role or the API key''s scopes
              no longer allow it'
    Snapshot:
      name: Snapshot
      title: Snapshot
      summary: The latest candle right after subscribing to a candles topic.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - topic
        - candle
        properties:
          type:
            const: snapshot
          topic:
            type: string
          sent_at: *id001
          candle:
            anyOf:
            - type: 'null'
            - &id002
              description: 'Lightweight Charts friendly: ``time`` is unix seconds (UTC) of the bucket
                start.

                ``spread`` is only present on 1m candles that have one.'
              properties:
                time:
                  title: Time
                  type: integer
                open:
                  title: Open
                  type: number
                high:
                  title: High
                  type: number
                low:
                  title: Low
                  type: number
                close:
                  title: Close
                  type: number
                volume:
                  title: Volume
                  type: number
                spread:
                  anyOf:
                  - type: number
                  - type: 'null'
                  default: null
                  description: 1m only, price units
                  title: Spread
              required:
              - time
              - open
              - high
              - low
              - close
              - volume
              title: CandleOut
              type: object
    Pong:
      name: Pong
      title: Pong
      summary: Answer to ping.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        properties:
          type:
            const: pong
          topic:
            type: string
          sent_at: *id001
    Heartbeat:
      name: Heartbeat
      title: Heartbeat
      summary: Sent every 25 s; no answer needed.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        properties:
          type:
            const: heartbeat
          topic:
            type: string
          sent_at: *id001
    Error:
      name: Error
      title: Error
      summary: A rejected client message; the socket stays open. token_expired (the token or key expired)
        and auth_revoked (API key revoked, expired or without stream; user deactivated or deleted; message
        = the reason) are followed by a close with 4401.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - code
        - message
        properties:
          type:
            const: error
          topic:
            type: string
          sent_at: *id001
          code:
            type: string
            enum:
            - bad_request
            - unknown_instrument
            - inactive_instrument
            - forbidden
            - too_many_subscriptions
            - token_expired
            - auth_revoked
            - unavailable
          message:
            type: string
    Candle:
      name: Candle
      title: Candle
      summary: Live update of the current candle (at most one per publish).
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - instrument_id
        - timeframe
        - candle
        properties:
          type:
            const: candle
          topic:
            type: string
          sent_at: *id001
          instrument_id: &id003
            type: string
            format: uuid
          timeframe:
            type: string
          candle: *id002
    Signal:
      name: Signal
      title: Signal
      summary: A live strategy signal. A private custom strategy's signals reach only its owner and admins
        (same frame and topic).
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - signal
        properties:
          type:
            const: signal
          topic:
            type: string
          sent_at: *id001
          signal: &id004
            type: object
            required:
            - id
            - instrument_id
            - timeframe
            - strategy_key
            - side
            - price
            - bar_time
            properties:
              id: *id003
              instrument_id: *id003
              timeframe:
                type: string
                enum:
                - 1m
                - 5m
                - 15m
                - 1h
                - 4h
                - 1d
              strategy_key:
                type: string
                examples:
                - rsi_reversal
                - custom:<uuid>
              params:
                type: object
              params_hash:
                type: string
              time:
                type: integer
                description: bar start, unix seconds
              bar_time:
                type: string
                format: date-time
              side:
                type: string
                enum:
                - buy
                - sell
              strength:
                type: number
              price:
                type: number
              reason:
                type: string
              details:
                type: object
    UserSignal:
      name: UserSignal
      title: UserSignal
      summary: A signal of one of your active strategies (notify=true), with your trade plans.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - signal
        - user_strategy_ids
        properties:
          type:
            const: signal
          topic:
            type: string
          sent_at: *id001
          signal: *id004
          user_strategy_ids:
            type: array
            items: *id003
          plan:
            type:
            - object
            - 'null'
            description: your trade plan
          plans:
            type: array
            items:
              type: object
    Notification:
      name: Notification
      title: Notification
      summary: Every inbox notification (signals, backtests, security, posts, alerts, chat, subscriptions).
        A batched one (likes, chat) arrives again with the same id.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - notification
        properties:
          type:
            const: notification
          topic:
            type: string
          sent_at: *id001
          notification:
            properties:
              id:
                format: uuid
                title: Id
                type: string
              type:
                $ref: '#/components/schemas/NotificationType'
              title:
                title: Title
                type: string
              body:
                title: Body
                type: string
              data:
                additionalProperties: true
                title: Data
                type: object
              severity:
                $ref: '#/components/schemas/Severity'
              created_at:
                format: date-time
                title: Created At
                type: string
              read_at:
                anyOf:
                - format: date-time
                  type: string
                - type: 'null'
                title: Read At
            required:
            - id
            - type
            - title
            - body
            - data
            - severity
            - created_at
            - read_at
            title: NotificationRead
            type: object
    BacktestProgress:
      name: BacktestProgress
      title: BacktestProgress
      summary: Progress of one of your backtests.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - backtest_id
        - status
        - progress
        properties:
          type:
            const: backtest_progress
          topic:
            type: string
          sent_at: *id001
          backtest_id: *id003
          status:
            type: string
          progress:
            type: integer
            minimum: 0
            maximum: 100
    BacktestCompleted:
      name: BacktestCompleted
      title: BacktestCompleted
      summary: Your backtest finished.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - backtest_id
        - status
        properties:
          type:
            const: backtest_completed
          topic:
            type: string
          sent_at: *id001
          backtest_id: *id003
          status:
            const: completed
          metrics:
            type: object
    BacktestFailed:
      name: BacktestFailed
      title: BacktestFailed
      summary: Your backtest failed.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - backtest_id
        - status
        properties:
          type:
            const: backtest_failed
          topic:
            type: string
          sent_at: *id001
          backtest_id: *id003
          status:
            const: failed
          error:
            type: string
    WorkspaceUpdated:
      name: WorkspaceUpdated
      title: WorkspaceUpdated
      summary: One of your workspaces changed on another device.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - action
        properties:
          type:
            const: workspace_updated
          topic:
            type: string
          sent_at: *id001
          workspace_id:
            anyOf:
            - *id003
            - type: 'null'
          version:
            type:
            - integer
            - 'null'
          action:
            type: string
            enum:
            - created
            - state_updated
            - renamed
            - default_changed
            - deleted
            - reordered
            - shared
            - unshared
    PriceAlert:
      name: PriceAlert
      title: PriceAlert
      summary: One of your price alerts fired.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - notification_id
        - alert_id
        - price
        - bar_time
        properties:
          type:
            const: price_alert
          topic:
            type: string
          sent_at: *id001
          notification_id: *id003
          alert_id: *id003
          instrument:
            type: object
          condition:
            type: string
          value:
            type: number
          price:
            type: number
          bar_time:
            type: string
            format: date-time
          note:
            type:
            - string
            - 'null'
    News:
      name: News
      title: News
      summary: A new article.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - article
        properties:
          type:
            const: news
          topic:
            type: string
          sent_at: *id001
          article:
            type: object
            required:
            - id
            - url
            - title
            - published_at
            - instruments
            properties:
              id: *id003
              source:
                type: object
                required:
                - key
                - name
                properties:
                  key:
                    type: string
                  name:
                    type: string
              url:
                type: string
              title:
                type: string
              summary:
                type:
                - string
                - 'null'
              image_url:
                type:
                - string
                - 'null'
              language:
                type:
                - string
                - 'null'
              published_at:
                type: string
                format: date-time
              sentiment:
                anyOf:
                - type: 'null'
                - type: object
                  required:
                  - label
                  properties:
                    label:
                      type: string
                    score:
                      type: number
              instruments:
                type: array
                items:
                  type: object
                  required:
                  - instrument_id
                  - symbol
                  properties:
                    instrument_id: *id003
                    symbol:
                      type: string
                    relevance:
                      type: number
    ChatMessage:
      name: ChatMessage
      title: ChatMessage
      summary: A new message in the conversation.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - conversation_id
        - message
        properties:
          type:
            const: chat_message
          topic:
            type: string
          sent_at: *id001
          conversation_id: *id003
          message: &id005
            properties:
              id:
                format: uuid
                title: Id
                type: string
              conversation_id:
                format: uuid
                title: Conversation Id
                type: string
              sender_id:
                format: uuid
                title: Sender Id
                type: string
              body:
                anyOf:
                - type: string
                - type: 'null'
                description: null when deleted
                title: Body
              attachments:
                items:
                  additionalProperties: true
                  type: object
                title: Attachments
                type: array
              client_id:
                anyOf:
                - format: uuid
                  type: string
                - type: 'null'
                description: only for the sender
                title: Client Id
              edited_at:
                anyOf:
                - format: date-time
                  type: string
                - type: 'null'
                title: Edited At
              deleted:
                title: Deleted
                type: boolean
              created_at:
                format: date-time
                title: Created At
                type: string
            required:
            - id
            - conversation_id
            - sender_id
            - body
            - attachments
            - client_id
            - edited_at
            - deleted
            - created_at
            title: MessageRead
            type: object
    ChatMessageUpdated:
      name: ChatMessageUpdated
      title: ChatMessageUpdated
      summary: 'A message was edited or deleted (tombstone: deleted=true, body=null).'
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - conversation_id
        - message
        properties:
          type:
            const: chat_message_updated
          topic:
            type: string
          sent_at: *id001
          conversation_id: *id003
          message: *id005
    ChatRead:
      name: ChatRead
      title: ChatRead
      summary: A participant moved their read marker.
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - conversation_id
        - user_id
        - read_at
        properties:
          type:
            const: chat_read
          topic:
            type: string
          sent_at: *id001
          conversation_id: *id003
          user_id: *id003
          read_at:
            type: string
    ChatTyping:
      name: ChatTyping
      title: ChatTyping
      summary: A participant is typing (both sides receive it; ignore your own user_id).
      contentType: application/json
      payload:
        type: object
        required:
        - type
        - conversation_id
        - user_id
        properties:
          type:
            const: chat_typing
          topic:
            type: string
          sent_at: *id001
          conversation_id: *id003
          user_id: *id003
  schemas:
    NotificationType:
      enum:
      - signal
      - backtest_completed
      - backtest_failed
      - security
      - system
      - new_post
      - comment_reply
      - post_liked
      - content_hidden
      - price_alert
      - chat_message
      - subscription_started
      - subscription_renewed
      - subscription_payment_failed
      - subscription_canceled
      - new_subscriber
      title: NotificationType
      type: string
    Severity:
      enum:
      - info
      - success
