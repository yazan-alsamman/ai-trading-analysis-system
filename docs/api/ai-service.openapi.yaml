openapi: 3.1.0
info:
  title: ai-service (stateless trading engine)
  version: 0.2.2
  description: "The stateless trading engine (ai-service, owned by Fadi). The backend owns the data,\n\
    the schedule, the storage and the delivery; ai-service decides setups and their states.\n\n**Version\
    \ 0.2.2**: Fadi's answers to the 17 open points of 0.1.0-draft are applied\n(docs/ai-contract.md,\
    \ section 7); 0.2.1 accepts `status: ok` with `versions.model` null; 0.2.2\nadds the optional `instrument_spec.cost_per_unit`\
    \ to `/v1/size`.\n`/v1` changes only by adding fields; `info.version` follows semver; ai-service reports\
    \ its\nversions in every answer and in `/health`. Generated from\nbackend/app/ai/contract.py by backend/scripts/ai_contract.py\
    \ (do not edit by hand).\n\n- Every timestamp is UTC, ISO-8601 with `Z`. Every bar is closed; `ts`\
    \ is its open time.\n  `1d` bars are New York trading days: 17:00 to 17:00 America/New_York (DST-aware).\n\
    - The decision bar (the last bar of the smallest timeframe) always has a `spread`; without\n  one\
    \ the backend does not call ai-service.\n- `request_id` is deterministic (`{instrument lower}-{profile}-{bar_close_ts}`):\
    \ the same\n  body gives a byte-identical response, and a retry always sends the same body.\n- `setup_id`\
    \ is deterministic and chosen by ai-service; `open_setups` echoes setups exactly as\n  last returned.\
    \ A response carries the current state of every setup in `new_setups` and its\n  full history in `transitions`\
    \ (the backend dedupes by `(setup_id, to, at)`; a state never\n  goes backwards).\n- Transitions:\
    \ DEVELOPING -> ARMED -> ACTIVE -> CLOSED; DEVELOPING or ARMED -> EXPIRED or\n  INVALIDATED. ARMED\
    \ and ACTIVE may share an `at`.\n- v1 has no model: the rules run alone, so `status` is `ok` with\
    \ `versions.model`,\n  `probability`, `ev_r`, `ev_r_lower` and `grade` null (not available, never\
    \ 0).\n  `grade` is A-D and always null in v1. Money is USD only in v1.\n- `instrument_spec.cost_per_unit`\
    \ (0.2.2, `/v1/size` only): the instrument's fixed trading\n  cost per unit, price units, per round\
    \ trip (XAU/USD 0.25 per oz, whatever the real\n  spread). Size with a risk per unit of `|entry -\
    \ sl| + cost_per_unit`; absent: none.\n- Responses may carry fields this document does not list (the\
    \ backend ignores them).\n- 422: the request does not match the contract (never retried). 5xx, timeouts\
    \ and connection\n  errors are retried by the backend with the same body. A model is registered but\
    \ not\n  loaded: 200 with `status: model_unavailable` (nothing is stored).\n"
servers:
- url: http://ai-service:8001
  description: inside the compose network
paths:
