  /health:
    get:
      operationId: health
      summary: Liveness, with the loaded versions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Abstention:
      properties:
        reason:
          examples:
          - high_impact_event
          maxLength: 64
          title: Reason
          type: string
        detail:
          additionalProperties: true
          description: an object (Fadi, point 14)
          title: Detail
          type: object
      required:
      - reason
      title: Abstention
      type: object
    Account:
      additionalProperties: false
      properties:
        balance:
          exclusiveMinimum: 0
          title: Balance
          type: number
        currency:
          examples:
          - USD
          pattern: ^[A-Z0-9]{2,16}$
          title: Currency
          type: string
        leverage:
          exclusiveMinimum: 0
          maximum: 10000
          title: Leverage
          type: number
      required:
      - balance
      - currency
      - leverage
      title: Account
      type: object
    Bar:
      additionalProperties: false
      description: One **closed** bar. ``ts`` is the bar's open time (UTC); it closes at ``ts`` + timeframe.
      properties:
        ts:
          format: date-time
          title: Ts
          type: string
        o:
          exclusiveMinimum: 0
          title: O
          type: number
        h:
          exclusiveMinimum: 0
          title: H
          type: number
        l:
          exclusiveMinimum: 0
          title: L
          type: number
        c:
          exclusiveMinimum: 0
          title: C
          type: number
        spread:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          description: 'average spread over the bar, in price units (XAU/USD 0.25). The decision bar (the
            last bar of the smallest timeframe) always has one: without it the backend does not call ai-service'
          title: Spread
      required:
      - ts
      - o
      - h
      - l
      - c
      title: Bar
      type: object
    CalendarEvent:
      additionalProperties: false
      description: An economic-calendar event (B6 ``for_evaluate``).
      properties:
        ts:
          format: date-time
          title: Ts
          type: string
        currency:
          examples:
          - USD
          pattern: ^[A-Z]{2,8}$
          title: Currency
          type: string
        impact:
          enum:
          - high
          - medium
          - low
          - holiday
          title: Impact
          type: string
        title:
          maxLength: 255
          minLength: 1
          title: Title
          type: string
      required:
      - ts
      - currency
      - impact
      - title
      title: CalendarEvent
      type: object
    Direction:
      enum:
      - buy
      - sell
      title: Direction
      type: string
    ErrorItem:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Loc
          type: array
        msg:
          title: Msg
          type: string
        type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Type
      required:
      - msg
      title: ErrorItem
      type: object
    ErrorResponse:
      description: 422 (FastAPI style).
      properties:
        detail:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            type: array
          - type: string
          title: Detail
      required:
      - detail
      title: ErrorResponse
      type: object
    EvaluateRequest:
      additionalProperties: false
      description: 'Evaluate the bar that closed at ``bar_close_ts``. Every bar is closed; the smallest

        timeframe ends exactly at ``bar_close_ts`` (its last bar is the one just closed, the

        decision bar, which has a spread). ``1d`` bars open at 17:00 America/New_York.'
      properties:
        request_id:
          description: 'deterministic: {instrument lower}-{profile}-{bar_close_ts}'
          examples:
          - xauusd-intraday-2026-10-19T14:15:00Z
          maxLength: 160
          title: Request Id
          type: string
        instrument:
          examples:
          - XAUUSD
          pattern: ^[A-Z0-9]{3,16}$
          title: Instrument
          type: string
        profile:
          examples:
          - intraday
          pattern: ^[a-z0-9_]{1,32}$
          title: Profile
          type: string
        bar_close_ts:
          format: date-time
          title: Bar Close Ts
          type: string
        bars:
          additionalProperties:
            items:
              $ref: '#/components/schemas/Bar'
            maxItems: 5000
            minItems: 1
            type: array
          description: 'timeframe -> bars, oldest first (defaults: 2000 x 15m, 500 x 1h, 300 x 4h, 260
            x 1d; fewer when the history is shorter)'
          propertyNames:
            enum:
            - 1m
            - 5m
            - 15m
            - 30m
            - 1h
            - 4h
            - 1d
          title: Bars
          type: object
        open_setups:
          description: every non-final setup of this instrument and profile, exactly as last returned
          items:
            $ref: '#/components/schemas/Setup'
          maxItems: 200
          title: Open Setups
          type: array
        calendar:
          items:
            $ref: '#/components/schemas/CalendarEvent'
          maxItems: 500
          title: Calendar
          type: array
        instrument_spec:
          $ref: '#/components/schemas/InstrumentSpec'
      required:
      - request_id
      - instrument
      - profile
      - bar_close_ts
      - bars
      - instrument_spec
      title: EvaluateRequest
      type: object
    EvaluateResponse:
      description: '``new_setups`` carries the **current state** of every setup ai-service knows about,
        and

        ``transitions`` the **full history** of their state changes (Fadi, point 10): the backend

        dedupes by ``(setup_id, to, at)``. The same body gives a byte-identical response (point

        16). ``status`` ``model_unavailable`` is a 200, not a 503 (point 8).'
      properties:
        request_id:
          title: Request Id
          type: string
        status:
          $ref: '#/components/schemas/EvaluateStatus'
        versions:
          $ref: '#/components/schemas/Versions'
        new_setups:
          items:
            $ref: '#/components/schemas/Setup'
          title: New Setups
          type: array
        transitions:
          items:
            $ref: '#/components/schemas/Transition'
          title: Transitions
          type: array
        abstentions:
          items:
            $ref: '#/components/schemas/Abstention'
          title: Abstentions
          type: array
      required:
      - request_id
      - status
      - versions
      title: EvaluateResponse
      type: object
    EvaluateStatus:
      enum:
      - ok
      - data_quality_failed
      - model_unavailable
      title: EvaluateStatus
      type: string
    ExplainRequest:
      additionalProperties: false
      properties:
        setup:
          $ref: '#/components/schemas/Setup'
        lang:
          enum:
          - ar
          - en
          title: Lang
          type: string
      required:
      - setup
      - lang
      title: ExplainRequest
      type: object
    ExplainResponse:
      description: 'Shown to a user only when ``verified`` or ``template_used`` (the fixed template filled

        with the setup''s own numbers); otherwise the explanation is unavailable (Fadi, extra 5).'
      properties:
        text:
          minLength: 1
          title: Text
          type: string
        verified:
          description: the text was checked against the setup's numbers
          title: Verified
          type: boolean
        template_used:
          description: true when the fixed template was used
          title: Template Used
          type: boolean
      required:
      - text
      - verified
      - template_used
      title: ExplainResponse
      type: object
    Grade:
      description: 'A best .. D worst (Fadi, point 1). **Always null in v1**: no model has passed the
        gate

        yet, so every reader (API, UI, alerts) must handle a null grade.'
      enum:
      - A
      - B
      - C
      - D
      title: Grade
      type: string
    Health:
      properties:
        status:
          const: ok
          title: Status
          type: string
        versions:
          anyOf:
          - $ref: '#/components/schemas/Versions'
          - type: 'null'
          default: null
      required:
      - status
      title: Health
      type: object
    InstrumentSpec:
      additionalProperties: false
      description: 'Contract specs (B4, docs/instruments.md), sent with every evaluate and size request

        (Fadi, point 2). Prices are rounded to ``tick_size``: the stop **away from** the entry, the

        target **toward** it (the backend uses the same rule wherever it rounds a price).'
      properties:
        contract_size:
          description: 'units per 1.0 lot (XAU/USD: 100 oz)'
          exclusiveMinimum: 0
          title: Contract Size
          type: number
        tick_size:
          description: 'minimum price increment (XAU/USD: 0.01)'
          exclusiveMinimum: 0
          title: Tick Size
          type: number
        lot_step:
          exclusiveMinimum: 0
          title: Lot Step
          type: number
        min_lot:
          exclusiveMinimum: 0
          title: Min Lot
          type: number
        max_lot:
          exclusiveMinimum: 0
          title: Max Lot
          type: number
        price_basis:
          description: the price the bars use
          enum:
          - bid
          - mid
          - last
          title: Price Basis
          type: string
        session_calendar:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          description: 'when the market trades (docs/instruments.md#session-calendar); null: 24/7'
          title: Session Calendar
        quote_currency:
          anyOf:
          - pattern: ^[A-Z0-9]{2,16}$
            type: string
          - type: 'null'
          default: null
          description: 'currency of the P&L per price unit (XAU/USD: USD)'
          title: Quote Currency
        margin_rate:
          anyOf:
          - exclusiveMinimum: 0
            maximum: 1
            type: number
          - type: 'null'
          default: null
          description: 'margin as a fraction of notional; margin = notional in USD x max(margin_rate,
            1 / leverage); null: 1 / leverage'
          title: Margin Rate
        cost_per_unit:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          description: 'fixed trading cost per unit of quantity, price units, per round trip (XAU/USD:
            0.25 per oz: spread and every cost). Size with a risk per unit of |entry - sl| + cost_per_unit.
            Sent with /v1/size (contract 0.2.2); null: none'
          title: Cost Per Unit
      required:
      - contract_size
      - tick_size
      - lot_step
      - min_lot
      - max_lot
      - price_basis
      title: InstrumentSpec
      type: object
    RiskSettings:
      additionalProperties: false
      description: '``daily_loss_limit_pct`` and ``max_drawdown_pct`` are optional (Fadi, point 15): the

        backend applies both guards itself before calling ``/v1/size`` (B10).'
      properties:
        risk_per_trade_pct:
          exclusiveMinimum: 0
          maximum: 100
          title: Risk Per Trade Pct
          type: number
        daily_loss_limit_pct:
          anyOf:
          - exclusiveMinimum: 0
            maximum: 100
            type: number
          - type: 'null'
          default: null
          title: Daily Loss Limit Pct
        max_drawdown_pct:
          anyOf:
          - exclusiveMinimum: 0
            maximum: 100
            type: number
          - type: 'null'
          default: null
          title: Max Drawdown Pct
      required:
      - risk_per_trade_pct
      title: RiskSettings
      type: object
    Setup:
      additionalProperties: true
      description: 'A trade setup as ai-service returns it. ``setup_id`` is deterministic (ai-service).


        Unknown fields are kept, and a setup parsed from JSON serialises back to that exact JSON,

        so ``open_setups`` echoes it unchanged. In ``ARMED`` and ``ACTIVE``, ``entry``, ``sl`` and

        ``tp`` are required and on the right side: buy ``sl < entry < tp``, sell ``tp < entry < sl``.'
      properties:
        setup_id:
          maxLength: 128
          minLength: 1
          title: Setup Id
          type: string
        state:
          $ref: '#/components/schemas/SetupState'
        direction:
          $ref: '#/components/schemas/Direction'
        entry:
          anyOf:
          - exclusiveMinimum: 0
            type: number
          - type: 'null'
          default: null
          title: Entry
        sl:
          anyOf:
          - exclusiveMinimum: 0
            type: number
          - type: 'null'
          default: null
          title: Sl
        tp:
          anyOf:
          - exclusiveMinimum: 0
            type: number
          - type: 'null'
          default: null
          title: Tp
        r_multiple:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: reward / risk at entry
          title: R Multiple
        probability:
          anyOf:
          - maximum: 1
            minimum: 0
            type: number
          - type: 'null'
          default: null
          description: of reaching tp first; null without a model (v1)
          title: Probability
        ev_r:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: expected value in R; null without a model (v1)
          title: Ev R
        ev_r_lower:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: lower bound of ev_r; null without a model (v1)
          title: Ev R Lower
        grade:
          anyOf:
          - $ref: '#/components/schemas/Grade'
          - type: 'null'
          default: null
          description: A best .. D; always null in v1
        valid_until:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          description: entry no longer valid
          title: Valid Until
        horizon_until:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          description: trade horizon end
          title: Horizon Until
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          description: close of the bar where the setup became known as DEVELOPING (the time of its first
            event); optional until ai-service sends it
          title: Created At
        evidence:
          additionalProperties: true
          title: Evidence
          type: object
        features:
          additionalProperties: true
          title: Features
          type: object
      required:
      - setup_id
      - state
      - direction
      title: Setup
      type: object
    SetupState:
      enum:
      - DEVELOPING
      - ARMED
      - ACTIVE
      - CLOSED
      - EXPIRED
      - INVALIDATED
      title: SetupState
      type: string
    SizeRequest:
      additionalProperties: false
      properties:
        setup:
          $ref: '#/components/schemas/Setup'
        instrument_spec:
          $ref: '#/components/schemas/InstrumentSpec'
        account:
          $ref: '#/components/schemas/Account'
        risk:
          $ref: '#/components/schemas/RiskSettings'
      required:
      - setup
      - instrument_spec
      - account
      - risk
      title: SizeRequest
      type: object
    SizeResponse:
      description: 'Money is USD only in v1 (Fadi, point 3): ``risk_usd`` is always USD, ai-service converts

        from the quote currency (e.g. JPY) itself.'
      properties:
        lots:
          minimum: 0
          title: Lots
          type: number
        risk_usd:
          minimum: 0
          title: Risk Usd
          type: number
        margin_required:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Margin Required
        feasible:
          title: Feasible
          type: boolean
        warnings:
          items:
            type: string
          title: Warnings
          type: array
      required:
      - lots
      - risk_usd
      - feasible
      title: SizeResponse
      type: object
    Transition:
      description: A state change of an existing setup, decided by ai-service.
      properties:
        setup_id:
          maxLength: 128
          minLength: 1
          title: Setup Id
          type: string
        from:
          $ref: '#/components/schemas/SetupState'
        to:
          $ref: '#/components/schemas/SetupState'
        at:
          format: date-time
          title: At
          type: string
        reason:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          default: null
          title: Reason
        realized_r:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: set when it closes
          title: Realized R
      required:
      - setup_id
      - from
      - to
      - at
      title: Transition
      type: object
    Versions:
      description: 'Always present: ``strategy`` and ``features`` (Fadi, point 12). ``model`` is null
        when no

        model runs: with ``ok`` that is v1, the rules alone (``probability``, ``ev_r`` and

        ``grade`` null too); ``model_unavailable`` is only "a model is registered but not loaded"

        (Fadi, 25 Oct; contract 0.2.1).'
      properties:
        strategy:
          maxLength: 64
          title: Strategy
          type: string
        model:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          default: null
          description: 'null: no model runs (ok: rules only, v1) or it is not loaded'
          title: Model
        features:
          maxLength: 64
          title: Features
          type: string
      required:
      - strategy
      - features
      title: Versions
      type: object
