- name: news
  description: News, sentiment and the ingestion API of the AI side (news:read / news:write).
- name: posts
  description: Posts, comments, likes, follows, profiles and moderation.
- name: price-alerts
  description: Price alerts.
- name: experts
  description: Experts directory, profiles, plans, signals feed, earnings.
- name: subscriptions
  description: Checkout, subscriptions, invoices (demo payments) and admin tools.
- name: payments-demo
  description: The demo provider's hosted payment pages and the payment webhook (no login; no real money).
- name: calendar
