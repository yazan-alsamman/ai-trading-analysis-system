      description: 'Candles ascending by time. With ``start``: the first ``limit`` candles from ``start``;

        otherwise the latest ``limit`` candles (up to ``end`` if given).


        With ``closed_only=true`` only bars that have ended are returned: ``time + timeframe <=``

        the end of the last closed 1m bar (docs/data-quality.md). At 10:07 with 1m data up to

        10:06, the 15m bar of 10:00 is still forming and 09:45 is the last closed one.'
      operationId: market_get_candles
      parameters:
      - name: instrument_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Instrument Id
      - name: timeframe
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Timeframe'
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: ISO 8601, inclusive
          title: Start
        description: ISO 8601, inclusive
      - name: end
        in: query
        required: false
        schema:
