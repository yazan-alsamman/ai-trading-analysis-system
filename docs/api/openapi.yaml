openapi: 3.1.0
info:
  title: AI Trading Platform API
  description: REST API of the AI Trading Platform. Live data and chat use the WebSocket `/ws/market`
    (see `asyncapi.yaml`). Errors share the `Error` schema; every rate-limited response carries `RateLimit-*`
    headers.
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Api V1 Health Get
  /api/v1/health/live:
    get:
      tags:
      - health
      summary: Live
      description: 'The process answers (no dependency checked): for liveness probes.'
      operationId: health_live
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Live Api V1 Health Live Get
  /api/v1/health/ready:
    get:
      tags:
      - health
      summary: Ready
      description: '``status`` is ``ok`` when the database and Redis answer (the deploy waits for it).

        ``data`` is the worst data-quality status (``/health/data``), for information only: it

        never changes ``status`` or the HTTP code.'
      operationId: health_ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready Api V1 Health Ready Get
  /api/v1/health/data:
    get:
      tags:
      - health
      summary: Data
      description: 'Data quality of every monitored instrument (``DATA_QUALITY_INSTRUMENTS``): the latest

        report of the ``data_quality.check`` task (computed now if there is none). **503** when

        any instrument is ``degraded`` or ``no_data``, 200 when all are ``ok`` or ``closed``.

        Public and read-only; ``/health/ready`` does not depend on it (docs/data-quality.md).'
      operationId: health_data
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataHealth'
        '503':
          description: an instrument is degraded or no_data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataHealth'
  /api/v1/pay/demo/{checkout_id}:
    get:
      tags:
      - payments-demo
      summary: Demo Checkout Page
      description: 'The demo provider''s hosted payment page (HTML). No real money: test cards only.'
      operationId: payments_demo_demo_checkout_page
      parameters:
      - name: checkout_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Checkout Id
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Not found (or not visible to you)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict with the current state (version, duplicate, already done)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/pay/demo/{checkout_id}/confirm:
    post:
      tags:
      - payments-demo
      summary: Demo Checkout Confirm
      description: 'The form of the demo page: the "provider" charges the test card and sends the signed

        ``checkout.completed`` / ``checkout.failed`` event to the payment webhook handler (the same

        verification and processing as ``POST /payments/webhook/demo``), then redirects (303).'
      operationId: payments_demo_demo_checkout_confirm
      parameters:
      - name: checkout_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Checkout Id
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_demo_checkout_confirm_api_v1_pay_demo__checkout_id__confirm_post'
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/Error'
        '404':
          description: Not found (or not visible to you)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict with the current state (version, duplicate, already done)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (Retry-After header)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/pay/demo/{checkout_id}/done:
    get:
      tags:
