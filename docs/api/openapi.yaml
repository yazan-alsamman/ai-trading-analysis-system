      summary: Payment Webhook
      description: 'Provider events (``checkout.completed``, ``checkout.failed``, ``invoice.paid``,

        ``invoice.payment_failed``). 401 on a bad signature; a repeated ``event id`` is accepted

        and ignored (``duplicate``).'
