        kind: builder
        definition:
          schema_version: 1
          category: mean_reversion
          strength: fixed
          buy:
            all:
            - left:
                type: indicator
                name: rsi
                params:
                  length: 14
              op: <
              right:
                type: constant
                value: 35
            - left:
                type: price
                field: close
              op: <
              right:
                type: indicator
                name: bollinger
                params:
                  length: 20
                  std: 2
                output: lower
          sell:
            any:
            - left:
                type: indicator
                name: rsi
                params:
                  length: 14
              op: '>'
              right:
                type: constant
                value: 65
