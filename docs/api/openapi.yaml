        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          default: 500
          title: Limit
      - name: closed_only
        in: query
        required: false
        schema:
          type: boolean
          description: 'Only closed bars: leave out the bar that is still forming (the default includes
            it, as charts want). Adds `last_closed_bar`.'
