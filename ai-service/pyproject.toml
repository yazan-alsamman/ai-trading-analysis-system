[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  # the live scanner runs the research rules (P6): pandas frames; pyarrow is imported by
  # app.data.mt5, which the detector loads
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
]

[project.optional-dependencies]
# Offline research (importer, reports); not installed in the production image.
# trading-indicators is the repo's libs/indicators (app/strategies, app/management): not on PyPI,
# so install it first (`pip install -e ../libs/indicators`; uv reads tool.uv.sources). It stays
# out of the base dependencies until the production image can see libs/ (stage F).
research = ["matplotlib>=3.8", "scikit-learn>=1.8", "lightgbm>=4.5", "trading-indicators"]
dev = [
  "pytest>=8", "httpx>=0.27", "ruff>=0.6", "pandas>=2.2", "pyarrow>=15", "matplotlib>=3.8",
  "scikit-learn>=1.8", "lightgbm>=4.5", "trading-indicators",
]

[tool.uv.sources]
trading-indicators = { path = "../libs/indicators", editable = true }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.config" = ["*.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
