# Per-instrument specs (FxPro). Code is instrument-agnostic and reads everything from here.
# Session times are New York wall-clock: the week opens Sunday `week_open` and closes Friday
# `week_close`; `daily_break` (when set) closes the market every day between the two times.
# Session hours are initial values; the P1 data-quality report checks them against the exports.

[XAUUSD]
point = 0.01            # price value of one MT5 point
price_decimals = 2
contract_size = 100     # troy ounces per lot
quote_currency = "USD"
week_open = "18:00"
week_close = "17:00"
daily_break = ["17:00", "18:00"]
# Costs (price units): spread + max(cost_extra_frac * spread, cost_extra_min); SL fills slip by
# sl_slippage. $0.10 is the design's minimum; the SL slippage value is an initial assumption.
cost_extra_frac = 0.5
cost_extra_min = 0.10
sl_slippage = 0.10

# FX pairs (Fadi, 2026-10-22): the same formula with a 0.2 pip minimum and 0.2 pip SL slippage,
# about the gold ratio ($0.10 against a median spread near $0.38; FX median spreads 0.7-1.2 pips).

[EURUSD]
point = 0.00001
price_decimals = 5
contract_size = 100000
quote_currency = "USD"
week_open = "17:00"
week_close = "17:00"
cost_extra_frac = 0.5
cost_extra_min = 0.00002
sl_slippage = 0.00002

