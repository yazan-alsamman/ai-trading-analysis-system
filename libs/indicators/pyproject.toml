[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-indicators"
version = "0.1.0"
description = "Technical indicators on pandas OHLCV data (numpy/pandas only, no look-ahead)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
# TA-Lib is only a reference to verify our numbers in tests, never a runtime dependency.
# TA-Lib 0.8.2 ships no cp310 wheels (it would need the C library to build), so 3.10 stays below.
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "TA-Lib>=0.6; python_version >= '3.11'",
  "TA-Lib>=0.6,<0.8.2; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["trading_indicators*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
