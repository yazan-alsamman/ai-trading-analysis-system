[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-backtest"
version = "0.1.0"
description = "Backtesting of trading strategies on pandas OHLCV data (next-open fills, no look-ahead)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.7",  # risk config validation and JSON Schema (Y13)
  # local packages in libs/, installed first (pip cannot express relative paths)
  "trading-indicators",  # ATR for stops, trailing and volatility sizing (Y13)
  "trading-strategies",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
trading-indicators = { path = "../indicators", editable = true }
trading-strategies = { path = "../strategies", editable = true }

[tool.setuptools.packages.find]
include = ["trading_backtest*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: performance targets (bounds can be loosened with BACKTEST_PERF_FACTOR)"]
