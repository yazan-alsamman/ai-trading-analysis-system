# HOST nginx site, FIRST STEP only (docs/https.md): port 80 for the first certificate.
#
# The full site (trading.yazanalsamman.com.conf) refers to certificate files that do not exist
# before certbot runs, so `nginx -t` would fail. Install this file first, get the certificate
# with `certbot certonly --webroot`, then replace it with the full site.
#
# __PUBLIC_HOSTNAME__ is replaced when installing. One name only: never default_server, never a
# wildcard. Always `nginx -t` before `systemctl reload nginx`.

server {
    listen 80;
    server_name __PUBLIC_HOSTNAME__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trading-acme;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
