# HOST nginx site for the trading platform over HTTPS (docs/https.md). Not used by Docker.
#
#   - Installed BY HAND, as root, by the server owner, into /etc/nginx/sites-available/ and
#     symlinked into sites-enabled/. Nothing in CI or the deploy applies it.
#   - __PUBLIC_HOSTNAME__ is replaced when installing (PUBLIC_HOSTNAME,
#     trading.yazanalsamman.com): sed "s/__PUBLIC_HOSTNAME__/$HOST/g" (docs/https.md).
#   - This file serves ONE name only: never default_server, never a wildcard. The other sites of
#     this server are not touched; do not edit their files.
#   - Always `nginx -t` before `systemctl reload nginx` (reload, never restart).
#
# It proxies to our stack's nginx container on 127.0.0.1:8090 (loopback only), which trusts the
# client address and scheme sent from here and serves the same site as :8080.

# Port 80: certificate renewals (webroot) and a redirect to HTTPS.
server {
    listen 80;
    server_name __PUBLIC_HOSTNAME__;

    # certbot --webroot answers here (certonly + renewals); a directory of its own
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trading-acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` on the listen line works on nginx 1.24 (Ubuntu 24.04) and newer (1.25+ only warns)
    listen 443 ssl http2;
    server_name __PUBLIC_HOSTNAME__;

    # written by certbot for this name only (certonly --webroot -d __PUBLIC_HOSTNAME__)
    ssl_certificate /etc/letsencrypt/live/__PUBLIC_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_HOSTNAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HTTPS only for this name; no includeSubDomains (the other yazanalsamman.com sites decide
    # for themselves) and no preload
    add_header Strict-Transport-Security "max-age=31536000" always;

    # the largest body our container accepts (the calendar CSV import: 51m)
    client_max_body_size 51m;

    # what our container trusts on 8090: the real client (overwritten, never appended, so a
    # client-sent X-Forwarded-For is dropped) and the scheme
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Connection "";
    }

    # the calendar CSV import can take minutes (our container waits up to 600 s too)
    location = /api/v1/admin/calendar/import {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket hub (wss://__PUBLIC_HOSTNAME__/ws/market): upgrade, long-lived sockets
    location /ws/ {
        proxy_pass http://127.0.0.1:8090;
        # proxy_set_header in a location replaces the inherited ones, so repeat them all
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
