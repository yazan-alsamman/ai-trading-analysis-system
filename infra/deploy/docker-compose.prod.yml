# Production stack on the shared VPS (docs/deployment.md).
# Copied to /opt/trading/docker-compose.yml by the Deploy workflow; images come from GHCR.
# The VPS runs other live projects: everything here is scoped to the compose project "trading",
# its own network, its own volumes, and capped memory/CPU. Only nginx is published (port 8080).
# `cpus:` is a cap, not a reservation (ours add up to more than the 2 vCPUs), so every service also
# has cpu_shares 512 (Docker's default is 1024): when the host is busy the other projects get
# twice our weight; when it is idle we can still use our caps.
name: trading

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: ${BACKEND_IMAGE:-ghcr.io/yazan-alsamman/ai-trading-backend}:${IMAGE_TAG:?IMAGE_TAG is set by image.env}
  env_file: .env
  restart: unless-stopped
  logging: *logging
  cpu_shares: 512

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    logging: *logging
    cpu_shares: 512
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"  # loopback only, reachable through an SSH tunnel
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    cpu_shares: 512
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:  # runs `alembic upgrade head` on start (backend/Dockerfile)
    <<: *backend
    environment:
      FORWARDED_ALLOW_IPS: ${NGINX_IP:-172.30.57.10}
      API_WORKERS: ${API_WORKERS:-2}  # uvicorn worker processes (empty in .env = 2)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # two workers: 400 MiB peak in the load test (infra/loadtest); Y14 chart analysis adds up to
    # ~190 MiB (4 parallel 4.5 MB uploads, measured in docs/chart-analysis.md): 544m -> 640m
    mem_limit: 640m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Workers start after the backend is healthy, i.e. after migrations ran.
  worker:  # the signal engine (default queue) and notification sends (notifications queue)
    <<: *backend
    command: celery -A app.tasks worker -Q celery,notifications --loglevel=info --concurrency 2
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.75

  worker-backtest:
    <<: *backend
    command: >-
      celery -A app.tasks worker -Q backtests,maintenance --concurrency 2 --hostname backtests@%h
      --loglevel=info
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0

  beat:
    <<: *backend
    command: celery -A app.tasks beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 192m  # beat sits at ~106MiB after start
    cpus: 0.25

  # Telegram long polling (/start linking, /stop, /status). Idles when TELEGRAM_BOT_TOKEN is
  # empty or TELEGRAM_MODE=webhook. No port: it only makes outbound calls.
  telegram-bot:
    <<: *backend
    command: python -m app.notifications.telegram_bot
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25

  # B1: XAU/USD quotes from the cTrader Open API into 1m bars (docs/ctrader-feed.md). Idles
  # (logs once an hour) until CTRADER_ENABLED=true and an account is linked; never crash-loops.
  # No port: it only makes an outbound WebSocket connection.
  feed-ctrader:
    <<: *backend
    command: python -m app.feeds.ctrader
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25

  ai-service:
    image: ${AI_IMAGE:-ghcr.io/yazan-alsamman/ai-trading-ai-service}:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    cpu_shares: 512
    mem_limit: 512m  # B7: models and features in memory (approved; was 256m)
    cpus: 0.5

  nginx:
    # nginx:1.27-alpine plus the built web client (web/Dockerfile)
    image: ${WEB_IMAGE:-ghcr.io/yazan-alsamman/ai-trading-web}:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    cpu_shares: 512
    volumes:
      # the whole directory (default.conf + trading-site.inc): a changed file is seen at once,
      # never a stale copy as with single-file bind mounts
      - ./nginx:/etc/nginx/conf.d:ro
    ports:
      - "8080:80"  # the public entry point: http://187.127.76.76:8080
      # the host's nginx (HTTPS for trading.yazanalsamman.com) proxies here: loopback only,
      # Docker publishes around ufw, so it must never be bound to 0.0.0.0 (docs/https.md)
      - "127.0.0.1:8090:8090"
    networks:
      default:
        ipv4_address: ${NGINX_IP:-172.30.57.10}
    depends_on:
      - backend
    mem_limit: 64m
    cpus: 0.25

# Dynamic addresses come from DOCKER_IP_RANGE only, so no container can take NGINX_IP (outside it).
# remote-deploy.sh recreates the network once when the existing one has no such range.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.57.0/24}
          ip_range: ${DOCKER_IP_RANGE:-172.30.57.128/25}

volumes:
  db_data:
