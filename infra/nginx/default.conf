# Access log without credentials: /ws/market?token=<JWT> and ?api_key=<key> must not be logged.
# A query string that carries either parameter is logged as "[redacted]" as a whole.
map $args $log_args {
    default $args;
    "~(^|&)(token|api_key)=" "[redacted]";
}

# Security headers (docs/security.md). A header whose value is empty is not sent, so the demo
# payment page (which sets its own CSP and may be framed by the web app) skips the two below.
# Web pages (not /api/) get no CSP from here, so the web client's fetch/WebSocket to its own
# origin (https://… and wss://… behind the host proxy) is never blocked by connect-src.
map $uri $frame_options {
    ~^/api/v1/pay/demo/ "";
    default "DENY";
}
map $uri $api_csp {
    ~^/api/v1/pay/demo/ "";
    ~^/api/ "default-src 'none'; frame-ancestors 'none'";
    default "";
}

# The scheme the visitor used, as the host proxy reports it (port 8090 only): https or http,
# never anything else.
map $http_x_forwarded_proto $proxied_proto {
    https https;
    default http;
}

log_format no_secrets '$remote_addr - [$time_local] "$request_method $uri$is_args$log_args" '
                      '$status $body_bytes_sent $request_time "$http_user_agent"';
# port 8090: the real client, and the address the request came in from (the host proxy, seen
# through docker-proxy as the network gateway)
log_format no_secrets_proxied '$remote_addr via=$realip_remote_addr - [$time_local] '
                              '"$request_method $uri$is_args$log_args" $status '
                              '$body_bytes_sent $request_time "$http_user_agent" '
                              'proto=$proxied_proto';

# Port 80 (published as :8080 on the VPS): visitors directly. A client-sent X-Forwarded-For or
# X-Forwarded-Proto is ignored: the backend gets $remote_addr and this connection's scheme.
server {
    listen 80;
    access_log /var/log/nginx/access.log no_secrets;
    set $fwd_proto $scheme;
    include /etc/nginx/conf.d/trading-site.inc;
}

# Port 8090 (published on 127.0.0.1:8090 only, docker-compose.prod.yml): the host's nginx,
# which terminates HTTPS for trading.yazanalsamman.com (infra/host-nginx/, docs/https.md).
# Only here the forwarded client address and scheme are trusted, and only from our compose
# network (DOCKER_SUBNET, 172.30.57.0/24): docker-proxy connects to the container from the
# network's gateway, which Docker takes from DOCKER_IP_RANGE (172.30.57.128, not .1; seen in CI
# and in the local proof, docs/https.md), so the whole subnet is trusted rather than one
# guessed address. Nothing outside the host and our own containers can reach 8090. A request
# from anywhere else keeps its own address. Change this line if DOCKER_SUBNET changes.
server {
    listen 8090;
    access_log /var/log/nginx/access.log no_secrets_proxied;
    set_real_ip_from 172.30.57.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    set $fwd_proto $proxied_proto;
    include /etc/nginx/conf.d/trading-site.inc;
}
