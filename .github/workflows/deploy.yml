name: Deploy

# main is deployed automatically once CI passed on it; "Run workflow" redeploys by hand.
# Images are built here and pushed to GHCR, so the shared VPS only pulls (docs/deployment.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/yazan-alsamman/ai-trading-backend
  AI_IMAGE: ghcr.io/yazan-alsamman/ai-trading-ai-service

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build and push ai-service
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          push: true
          tags: ${{ env.AI_IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,scope=ai-service,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            Port ${{ secrets.VPS_PORT }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CFG
      - name: Upload stack files
        run: |
          ssh vps 'mkdir -p /opt/trading/nginx /opt/trading/backups'
          scp infra/deploy/docker-compose.prod.yml vps:/opt/trading/docker-compose.yml
          scp infra/nginx/default.conf vps:/opt/trading/nginx/default.conf
          scp .env.example infra/deploy/remote-deploy.sh infra/deploy/backup.sh vps:/opt/trading/
      - name: Pull images and restart the trading stack
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh vps 'docker login ghcr.io -u ${{ github.actor }} --password-stdin'
          ssh vps 'bash /opt/trading/remote-deploy.sh ${{ needs.build.outputs.tag }}'
      - name: Log out of GHCR on the server
        if: always()
        run: ssh vps 'docker logout ghcr.io' || true
      - name: Check from the internet
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 http://${{ secrets.VPS_HOST }}:8080/api/v1/health; then exit 0; fi
            sleep 3
          done
          echo "::error::The stack is healthy on the server but http://<VPS>:8080 is not reachable from outside (firewall?)"
          exit 1
