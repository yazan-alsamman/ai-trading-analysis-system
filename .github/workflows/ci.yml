name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://trading:trading@localhost:5432/trading_test
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ../libs/indicators -e ../libs/strategies -e ../libs/backtest
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: ERD docs are up to date (T05)
        run: python scripts/erd.py --check
      - name: API contract is up to date (T07)
        run: |
          python scripts/openapi.py --check
          python scripts/asyncapi.py --check
      - name: Tests (every log record kept, to look for secrets)
        run: pytest -q --log-file=/tmp/pytest.log --log-file-level=DEBUG
      - name: No secrets in the logs of the test run
        run: python scripts/check_log_secrets.py /tmp/pytest.log
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable --progress-spinner off
      - name: Static security analysis (bandit; fails on high severity)
        run: |
          pip install bandit
          bandit -r app -q --severity-level high

  indicators:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 for Colab/Kaggle-style environments, 3.12 like the backend
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: libs/indicators
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  strategies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: libs/strategies
    env:
      STRATEGIES_PERF_FACTOR: "3"  # shared CI runners are slower than a dev machine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ../indicators
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  backtest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: libs/backtest
    env:
      BACKTEST_PERF_FACTOR: "3"  # shared CI runners are slower than a dev machine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ../indicators -e ../strategies
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the signal strategies use libs/indicators (docs/strategies/PREREG.md, section 3)
      - run: pip install -e ../libs/indicators
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  api-contract:
    # the committed contract (docs/api) is valid and both client generators accept it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate the AsyncAPI document
        run: npx -y @asyncapi/cli@2.16.0 validate docs/api/asyncapi.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ai-service contract (draft) is up to date and parses
        # app/ai/contract.py needs only pydantic; the examples are embedded in the document
        run: |
          pip install "pydantic>=2.11" pyyaml
          python backend/scripts/ai_contract.py --check
          npx -y openapi-typescript@7.4.4 docs/api/ai-service.openapi.yaml -o /tmp/ts/ai-service.d.ts
          wc -l /tmp/ts/ai-service.d.ts
      - name: TypeScript client (openapi-typescript)
        run: |
          npx -y openapi-typescript@7.4.4 docs/api/openapi.json -o /tmp/ts/schema.d.ts
          wc -l /tmp/ts/schema.d.ts
      - name: Dart client (openapi-generator dart-dio)
        run: |
          npx -y @openapitools/openapi-generator-cli@2.15.3 version-manager set 7.10.0
          npx -y @openapitools/openapi-generator-cli@2.15.3 generate -i docs/api/openapi.json             -g dart-dio -o /tmp/dart --additional-properties=pubName=trading_api
          echo "dart files: $(find /tmp/dart/lib -name '*.dart' | wc -l)"

  e2e:
    # the compose stack (db, redis, backend, workers, beat, nginx) and the end-to-end suite
    # through Nginx; the suite removes its own accounts and market (purge-demo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: http://localhost
      E2E_ADMIN_EMAIL: ci-admin@example.com
      E2E_ADMIN_PASSWORD: Ci-Admin-Passw0rd-1
    steps:
      - uses: actions/checkout@v4
      - name: Stack configuration (.env.example + a first admin)
        run: |
          cp .env.example .env
          sed -i "s|^FIRST_ADMIN_EMAIL=.*|FIRST_ADMIN_EMAIL=$E2E_ADMIN_EMAIL|" .env
          sed -i "s|^FIRST_ADMIN_PASSWORD=.*|FIRST_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD|" .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait db redis backend worker worker-backtest beat nginx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx websockets
      - name: End-to-end suite
        working-directory: backend
        run: python -m pytest tests_e2e -v -p no:cacheprovider
      - name: Fake ai-service over the compose network (B9; dev/CI only, never in prod)
        # the backend's client in the worker container against tools/fake_ai_service (gzip
        # bodies, determinism, 503 retried, 422 contract error, explain 404)
        run: |
          docker compose --profile fake-ai up -d fake-ai
          docker compose cp docs/api/ai-service-examples/evaluate-request.json worker:/tmp/req.json
          docker compose cp tools/fake_ai_service/e2e_check.py worker:/tmp/e2e_check.py
          docker compose exec -T -e AI_SERVICE_URL=http://fake-ai:8001 -e AI_REQUEST_GZIP=true \
            worker python /tmp/e2e_check.py /tmp/req.json \
            || { docker compose --profile fake-ai logs fake-ai; exit 1; }
          docker compose --profile fake-ai rm -sf fake-ai
      - name: Host-proxy entry 8090 (real client IP from the proxy only; 80 ignores it)
        # Linux Docker with docker-proxy, as on the VPS: a connection to the loopback-published
        # 127.0.0.1:8090 reaches nginx from the compose network's gateway, inside DOCKER_SUBNET
        # (Docker takes it from DOCKER_IP_RANGE: 172.30.57.128; docs/https.md)
        run: |
          net="$(docker network ls -q --filter label=com.docker.compose.network=default \
            --filter label=com.docker.compose.project=ai-trading-analysis-system)"
          docker network inspect "$net" \
            --format '{{range .IPAM.Config}}subnet={{.Subnet}} gateway={{.Gateway}}{{end}}'
          curl -fsS -H 'X-Forwarded-For: 203.0.113.7' -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8090/api/v1/health/ready
          curl -sS -o /dev/null -H 'X-Forwarded-For: 203.0.113.7' http://127.0.0.1:8090/api/v1/proxy-check
          curl -sS -o /dev/null -H 'X-Forwarded-For: 198.51.100.9' http://localhost/api/v1/proxy-check
          sleep 1
          docker compose logs nginx | grep -E 'health/ready|proxy-check' | tail -4
          docker compose logs nginx | grep -q '203.0.113.7 via=172\.30\.57\.[0-9]* .* proto=https'
          docker compose logs backend | grep 'proxy-check' | tail -2
          docker compose logs backend | grep -q 'client=203.0.113.7'
          if docker compose logs backend | grep -q 'client=198.51.100.9'; then
            echo "::error::a spoofed X-Forwarded-For on port 80 reached the backend"; exit 1
          fi
      - name: Stack logs
        if: failure()
        run: docker compose logs --tail 150 backend worker worker-backtest beat

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - name: Nginx configs pass nginx -t (the stack's, and the host site templates)
        run: |
          docker run --rm -v "$PWD/infra/nginx:/etc/nginx/conf.d:ro" nginx:1.27-alpine nginx -t
          bash infra/host-nginx/check.sh
      - name: Validate the production stack
        run: |
          echo IMAGE_TAG=ci > image.env
          docker compose -f infra/deploy/docker-compose.prod.yml --project-directory . --env-file .env --env-file image.env config -q
      - run: for f in infra/deploy/*.sh; do bash -n "$f"; done
      - run: docker compose build backend ai-service
