name: trading_app
description: A professional trading application built with Flutter MVC.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.0
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.2
  syncfusion_flutter_charts: ^35.1.41
  go_router: ^17.5.0
  dio: ^5.11.1
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    # تراخيص الخطوط (OFL) - بتنقرأ بـ main.dart وبتطلع بصفحة التراخيص
    - assets/fonts/inter/OFL.txt
    - assets/fonts/jetbrains_mono/OFL.txt
    - assets/fonts/instrument_serif/OFL.txt
    - assets/fonts/ibm_plex_sans_arabic/OFL.txt
    - assets/fonts/noto_naskh_arabic/OFL.txt

  # الخطوط مضمّنة بالتطبيق (بدون تحميل من الإنترنت) - نفس هوية الويب:
  # Inter للنصوص، JetBrains Mono للأرقام، Instrument Serif للعناوين
  # التحريرية، ومعهن خطين عربيين لأنو خطوط الويب ما فيها حروف عربية.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-SemiBold.ttf
          weight: 600
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/instrument_serif/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/instrument_serif/InstrumentSerif-Italic.ttf
          style: italic
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/noto_naskh_arabic/NotoNaskhArabic.ttf
