[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.1",  # postgresql.distinct_on
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "celery>=5.4",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",  # crypto: RS256 for the FCM service-account token (Y15)
  "tzdata>=2024.1",  # quiet hours in the user's time zone (zoneinfo)
  "feedparser>=6.0.11",  # RSS/Atom parsing of the built-in news fetcher (Y18)
  "pwdlib[argon2]>=0.2",
  "email-validator>=2.2",
  "python-multipart>=0.0.9",
  # chart image analysis (Y14): the official Gemini SDK (async client), pinned; Pillow (13: the 12.x CVEs) for the
  # upload checks and re-encoding
  "google-genai==2.30.1",
  "pillow==13.0.0",  # 12.x: 37 CVEs fixed in 13.0.0 (pip-audit)
  # local packages in libs/: pip cannot express a relative path dependency, so it is
  # installed first everywhere (Dockerfile, CI, README); uv users get it via tool.uv.sources
  "trading-indicators",
  "trading-strategies",
  "trading-backtest",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "httpx-ws>=0.7", "pyyaml>=6"]

[tool.uv.sources]
trading-indicators = { path = "../libs/indicators", editable = true }
trading-strategies = { path = "../libs/strategies", editable = true }
trading-backtest = { path = "../libs/backtest", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.vision" = ["prompts/*.md"]  # the versioned Gemini prompts (Y14)
