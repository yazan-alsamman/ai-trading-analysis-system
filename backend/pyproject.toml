[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "celery>=5.4",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2",
  "email-validator>=2.2",
  "python-multipart>=0.0.9",
  # local package in libs/indicators: pip cannot express a relative path dependency, so it is
  # installed first everywhere (Dockerfile, CI, README); uv users get it via tool.uv.sources
  "trading-indicators",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "httpx-ws>=0.7"]

[tool.uv.sources]
trading-indicators = { path = "../libs/indicators", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
